name: Docker CI

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Python CI"]
    types: [completed]
    branches: [ main ]

jobs:
  # Job from previous task (only on main)
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install coverage flake8

    - name: Run tests with coverage
      run: |
        if [ -d "tests" ]; then
          coverage run -m pytest tests/ -v
        else
          echo "No tests found, skipping test execution"
        fi

    - name: Generate coverage report
      run: |
        coverage html
        coverage xml
        coverage report

    - name: Upload Python code as artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-code
        path: |
          **/*.py
          requirements.txt
          tests/
        retention-days: 5

  # New Docker CI job (only on main)
  docker-ci:
    name: Docker CI
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref == 'refs/heads/main'

    steps:
    # Step 1: Download artifact from previous job
    - name: Download Python code artifact
      uses: actions/download-artifact@v4
      with:
        name: python-code
        path: .

    # Step 2: Log in to DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 3: Build and push Docker image
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-todolist:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-todolist:latest
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/devops-todolist:latest
        cache-to: type=inline

    # Step 4: Display success message
    - name: Display build info
      run: |
        echo "✅ Docker image built and pushed successfully!"
        echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-todolist:${{ github.sha }}"
        echo "🏷️ Latest: ${{ secrets.DOCKERHUB_USERNAME }}/devops-todolist:latest"
        echo "🌐 DockerHub: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/devops-todolist"
        