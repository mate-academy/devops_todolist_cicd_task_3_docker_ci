name: Python and Docker CI

run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.8"
  DOCKER_IMAGE_NAME: kube2py

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage flake8
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

      - name: Generate coverage
        run: coverage run --source=. manage.py test

      - name: Display coverage report
        run: coverage report --show-missing

      - name: Check code style
        continue-on-error: true
        run: flake8 . --show-source --statistics

      - name: Check code complexity
        continue-on-error: true
        run: flake8 . --select C901 --max-complexity=6 --statistics

      - name: Upload Python artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: python-artifacts
          path: src
          if-no-files-found: error
          retention-days: 7

  docker-ci:
    if: github.ref == 'refs/heads/main'
    needs: python-ci
    runs-on: ubuntu-latest

    steps:
      - name: Download Python artifact
        uses: actions/download-artifact@v8
        with:
          name: python-artifacts
          path: src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}