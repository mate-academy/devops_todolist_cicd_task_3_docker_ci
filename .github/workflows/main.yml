name: "Python CI/CD"
run-name: "CI/CD by ${{ github.actor }} @ ${{ github.sha }}"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  
  PY_VERSION: "3.11"
 
  IMAGE_NAME: "vitalysemeniv/todoapp"


defaults:
  run:
    working-directory: src

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flake8

   
      - name: Run tests with coverage (Django)
        run: |
          coverage run manage.py test
          coverage xml -o coverage.xml

      
      - name: Show coverage report
        run: coverage report -m

      
      - name: Flake8 style check (non-blocking)
        run: flake8 .
        continue-on-error: true

     
      - name: Code complexity check (non-blocking)
        run: flake8 . --select=C901 --max-complexity=12
        continue-on-error: true

      
      - name: Upload artifact (source + coverage)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: python-source-${{ github.sha }}
          path: |
            src/**/*.py
            src/coverage.xml

  docker-ci:
  
    needs: python-ci
    runs-on: ubuntu-latest
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
