name: python-deployment
run-name: ${{ github.actor }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: 3.12
  DOCKER_IMAGE_NAME: kube2py

jobs:
  python-ci:
    name: python-ci
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps: 

    - uses: actions/checkout@v5
    
    - uses: actions/setup-python@v5
      name: Setup Python
      with:
        python-version: "${{env.PYTHON_VERSION}}"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt
        pip install coverage
    
    - name: Run tests
      run: |
        pytest
      
    - name: Coverage Report
      run: |
        coverage run -m pytest
        coverage report
    
    - name: Lint with flake8
      run: |
        flake8 . --show-source --statistics --exit-zero

    - name: Complexity Check
      run: |
        flake8 . --statistics --max-complexity=10 --exit-zero

    - name: Upload artifacts
      if: github.ref_name == 'main'
      uses: actions/upload-artifact@v4
      with:
        name: task_2_python_ci
        path: |
          ./src/**/*.py

  build-image:
    name: Build and Push
    needs: python-ci
    if: github.ref_name == 'main'
    runs on: ubuntu-latest
    
    steps:
      - uses actions/download-artifact@v4
        with:
          name: task_2_python_ci
          path: .

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          content: ./src
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}